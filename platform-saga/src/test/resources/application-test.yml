spring:
  config:
    import:
      - classpath:application-infra-redis-test.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/saga_store
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

saga:
  enabled: true

logging:
  level:
    com.wellmeet.saga: DEBUG
    org.hibernate.SQL: DEBUG
