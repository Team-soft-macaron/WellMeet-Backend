spring:
  application:
    name: domain-member-service
  config:
    import:
      - classpath:dev-secret.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${secret.database.url}
    username: ${secret.database.username}
    password: ${secret.database.password}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${secret.eureka.server-url}
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.wellmeet: DEBUG
    org.hibernate.SQL: DEBUG
