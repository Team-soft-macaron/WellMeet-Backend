spring:
  profiles:
    active: test

---

spring:
  config:
    activate:
      on-profile: test
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/test
    username: root
    password:
  jpa:
    #    show-sql: true
    properties:
      hibernate:
        #        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
  data:
    redis:
      host: localhost
      port: 6379

cors:
  origin: http://localhost:5173
