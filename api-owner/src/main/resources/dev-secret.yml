secret:
  eureka:
    server-url: http://[EC2-PRIVATE-IP]:8761/eureka/
  cors:
    origin: [CORS-ORIGIN]
  redis:
    host: [REDIS-HOST]
    port: [REDIS-PORT]
  kafka:
    bootstrap-servers: [KAFKA-BOOTSTRAP-SERVERS]
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 1
      buffer-memory: 33554432
      enable-idempotence: true
      max-in-flight-requests-per-connection: 5
      compression-type: lz4
