spring:
  application:
    name: api-user-service
  config:
    import:
      - classpath:dev-secret.yml
      - classpath:application-infra-redis-dev.yml
      - classpath:application-infra-kafka-dev.yml

server:
  port: 8086

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: BASIC

cors:
  origin: ${secret.cors.origin}
