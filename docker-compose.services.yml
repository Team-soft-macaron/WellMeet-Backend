version: '3.8'

services:
  # Eureka Server
  platform-discovery-server:
    build:
      context: .
      dockerfile: platform-discovery-server/Dockerfile
    container_name: platform-discovery-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: local
    networks:
      - wellmeet-network

  # Restaurant Service
  restaurant-service:
    build:
      context: .
      dockerfile: domain-restaurant/Dockerfile
    container_name: restaurant-service
    depends_on:
      - platform-discovery-server
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-restaurant:3306/wellmeet_restaurant
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://platform-discovery-server:8761/eureka/
    networks:
      - wellmeet-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  # Member Service
  member-service:
    build:
      context: .
      dockerfile: domain-member/Dockerfile
    container_name: member-service
    depends_on:
      - platform-discovery-server
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-member:3306/wellmeet_member
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://platform-discovery-server:8761/eureka/
    networks:
      - wellmeet-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  # Owner Service
  owner-service:
    build:
      context: .
      dockerfile: domain-owner/Dockerfile
    container_name: owner-service
    depends_on:
      - platform-discovery-server
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-owner:3306/wellmeet_owner
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://platform-discovery-server:8761/eureka/
    networks:
      - wellmeet-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8084/actuator/health" ]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  # Reservation Service
  reservation-service:
    build:
      context: .
      dockerfile: domain-reservation/Dockerfile
    container_name: reservation-service
    depends_on:
      - platform-discovery-server
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-reservation:3306/wellmeet_reservation
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      DB_PASSWORD: password
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://platform-discovery-server:8761/eureka/
    networks:
      - wellmeet-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8085/actuator/health" ]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

networks:
  wellmeet-network:
    external: true
