saga:
  enabled: true  # Saga 기능 활성화

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/saga_store?serverTimezone=Asia/Seoul
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway 사용으로 validate만
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.wellmeet.saga: DEBUG
